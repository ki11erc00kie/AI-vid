name: Make paradox videos

on:
  workflow_dispatch:          # lets you click "Run workflow" manually
  schedule:
    - cron: "0 14 * * *"      # daily at 14:00 UTC; delete these two lines to run manually only

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write         # needed so the workflow can save rendered_ids.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts requests pillow

      - name: Render FACT-CHECKED scripts
        run: python make_videos.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.TIKTOK_TOKEN_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.TIKTOK_TOKEN_SECRET }}
          VOICE: en-US-AndrewNeural
          MAX_VIDEOS: "3"

      - name: Upload new videos to TikTok drafts
        continue-on-error: true
        env:
          TIKTOK_TOKEN_URL: ${{ secrets.TIKTOK_TOKEN_URL }}
          TIKTOK_TOKEN_SECRET: ${{ secrets.TIKTOK_TOKEN_SECRET }}
        run: python upload_to_tiktok.py output --dry-run

      - name: Remember which videos were rendered
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rendered_ids.txt || true
          git diff --cached --quiet || (git commit -m "Update rendered_ids" && git push)

      - name: Save videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: output/
          if-no-files-found: ignore
          retention-days: 7
