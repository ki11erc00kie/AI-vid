name: Make paradox videos

on:
  workflow_dispatch:          # lets you click "Run workflow" manually
  schedule:
    - cron: "0 14 * * *"      # daily at 14:00 UTC; delete these two lines to run manually only

concurrency:
  group: make-videos          # never run two renders at once; the second waits for the first
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write         # needed so the workflow can save rendered_ids.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts requests pillow

      - name: Render FACT-CHECKED scripts
        run: python make_videos.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          VOICE: en-US-AndrewNeural
          MAX_VIDEOS: "3"

      - name: Remember which videos were rendered
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rendered_ids.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Update rendered_ids"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - name: Save videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: output/
          if-no-files-found: ignore
          retention-days: 7
